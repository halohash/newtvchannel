<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My TV Channel</title>

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap"
        rel="stylesheet"
    >

    <style>
        :root {
            --ticker-height: 54px;
            --ticker-background: #111111;
            --ticker-text: #ffffff;
            --clock-background: #111111;
            --clock-text: #ffffff;
            --icon-background: #ffffff;
            --icon-color: #111111;
            --weather-background: #222222;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #000000;
            font-family: "Open Sans", sans-serif;
        }

        #video {
            position: fixed;
            left: 0;
            top: 0;
            width: 100vw;
            height: 93.9vh;
            object-fit: fill;
            border: 0;
            margin: 0;
            padding: 0;
            background: #000000;
            cursor: pointer;
        }

        #ticker {
            position: fixed;

            left: 0;
            bottom: 0;

            width: 100vw;
            height: var(--ticker-height);

            display: flex;
            align-items: stretch;

            background: var(--ticker-background);
            color: var(--ticker-text);

            z-index: 1000;

            overflow: hidden;
        }

        #ticker-label {
            height: 100%;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 0 18px;

            font-size: 14px;
            font-weight: 700;

            white-space: nowrap;

            background: var(--clock-background);
        }

        #ticker-content {
            flex: 1;

            min-width: 0;

            display: flex;
            align-items: center;

            overflow: hidden;

            white-space: nowrap;
        }

        #ticker-text {
            display: inline-block;

            padding-left: 24px;
            padding-right: 24px;

            font-size: 17px;
            font-weight: 600;

            white-space: nowrap;
        }

        #clock-area {
            height: 100%;

            display: flex;
            align-items: center;

            margin-left: auto;

            flex-shrink: 0;
        }

        #channel-icon {
            width: 34px;
            height: 34px;

            margin-right: 10px;

            display: block;

            object-fit: cover;

            background: var(--icon-background);

            border-radius: 2px;
        }

        #clock {
            min-width: 145px;

            height: 100%;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 0 15px;

            background: var(--clock-background);
            color: var(--clock-text);

            font-size: 19px;
            font-weight: 700;

            white-space: nowrap;
        }

        #weather {
            height: 100%;

            display: flex;
            align-items: center;

            padding: 0 16px;

            background: var(--weather-background);

            font-size: 15px;
            font-weight: 600;

            white-space: nowrap;
        }

        #error-message {
            position: fixed;

            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);

            color: white;

            font-size: 20px;

            display: none;

            z-index: 2000;
        }

        @media (max-width: 700px) {
            :root {
                --ticker-height: 48px;
            }

            #ticker-label {
                display: none;
            }

            #ticker-text {
                font-size: 14px;
            }

            #clock {
                min-width: 115px;
                font-size: 14px;
                padding: 0 8px;
            }

            #weather {
                display: none;
            }

            #channel-icon {
                width: 28px;
                height: 28px;
                margin-right: 6px;
            }
        }
    </style>
</head>

<body>

    <video
        id="video"
        autoplay
        muted
        playsinline
        preload="auto"
    ></video>

    <div id="error-message">
        Unable to load video.
    </div>

    <div id="ticker">

        <div id="ticker-label">
            <span id="ticker-label-text">NOW</span>
        </div>

        <div id="ticker-content">
            <div id="ticker-text"></div>
        </div>

        <div id="weather">
            <span id="weather-text">Weather unavailable</span>
        </div>

        <div id="clock-area">

            <img
                id="channel-icon"
                src=""
                alt=""
            >

            <div id="clock">
                --:--:--
            </div>

        </div>

    </div>

    <script>
        let config = {};
        let videos = [];

        let currentVideo = null;
        let remainingVideos = [];

        let tickerItems = [];
        let tickerIndex = 0;

        let tickerTimer = null;

        const videoElement =
            document.getElementById("video");

        const clockElement =
            document.getElementById("clock");

        const tickerTextElement =
            document.getElementById("ticker-text");

        const tickerLabelElement =
            document.getElementById("ticker-label-text");

        const weatherElement =
            document.getElementById("weather-text");

        const channelIcon =
            document.getElementById("channel-icon");

        const errorMessage =
            document.getElementById("error-message");


        async function loadJSON(url) {
            const response =
                await fetch(
                    url,
                    {
                        cache: "no-store"
                    }
                );

            if (!response.ok) {
                throw new Error(
                    "Failed to load " + url
                );
            }

            return response.json();
        }


        function applyTheme() {
            const themeName =
                config.theme || "default";

            const themes =
                config.themes || {};

            const theme =
                themes[themeName] ||
                themes.default ||
                {};

            const root =
                document.documentElement;

            if (theme.tickerBackground)
                root.style.setProperty(
                    "--ticker-background",
                    theme.tickerBackground
                );

            if (theme.tickerText)
                root.style.setProperty(
                    "--ticker-text",
                    theme.tickerText
                );

            if (theme.clockBackground)
                root.style.setProperty(
                    "--clock-background",
                    theme.clockBackground
                );

            if (theme.clockText)
                root.style.setProperty(
                    "--clock-text",
                    theme.clockText
                );

            if (theme.iconBackground)
                root.style.setProperty(
                    "--icon-background",
                    theme.iconBackground
                );

            if (theme.iconColor)
                root.style.setProperty(
                    "--icon-color",
                    theme.iconColor
                );

            if (theme.weatherBackground)
                root.style.setProperty(
                    "--weather-background",
                    theme.weatherBackground
                );

            if (config.icon) {
                channelIcon.src =
                    config.icon;
            }

            if (config.channelName) {
                document.title =
                    config.channelName;
            }

            if (config.tickerLabel) {
                tickerLabelElement.textContent =
                    config.tickerLabel;
            }
        }


        function randomizeVideos() {
            remainingVideos =
                [...videos];

            for (
                let i = remainingVideos.length - 1;
                i > 0;
                i--
            ) {
                const j =
                    Math.floor(
                        Math.random() * (i + 1)
                    );

                [
                    remainingVideos[i],
                    remainingVideos[j]
                ] = [
                    remainingVideos[j],
                    remainingVideos[i]
                ];
            }

            if (
                remainingVideos.length > 1 &&
                remainingVideos[0] === currentVideo
            ) {
                [
                    remainingVideos[0],
                    remainingVideos[1]
                ] = [
                    remainingVideos[1],
                    remainingVideos[0]
                ];
            }
        }


        function getNextVideo() {
            if (!remainingVideos.length) {
                randomizeVideos();
            }

            return remainingVideos.shift();
        }


        function playNextVideo() {
            if (!videos.length) {
                errorMessage.style.display =
                    "block";

                return;
            }

            errorMessage.style.display =
                "none";

            const nextVideo =
                getNextVideo();

            if (!nextVideo) {
                return;
            }

            currentVideo =
                nextVideo;

            videoElement.src =
                nextVideo;

            videoElement.load();

            const playPromise =
                videoElement.play();

            if (playPromise) {
                playPromise.catch(() => {
                    /*
                     * Autoplay may be blocked by
                     * the browser. The video remains
                     * muted so browsers that permit
                     * muted autoplay can start it.
                     */
                });
            }
        }


        videoElement.addEventListener(
            "ended",
            () => {
                playNextVideo();
            }
        );


        videoElement.addEventListener(
            "error",
            () => {
                playNextVideo();
            }
        );


        videoElement.addEventListener(
            "stalled",
            () => {
                /*
                 * Do not immediately change videos
                 * on a temporary network stall.
                 */
            }
        );


        videoElement.addEventListener(
            "click",
            async () => {
                videoElement.muted =
                    false;

                try {
                    await videoElement.play();
                } catch (error) {
                    console.error(error);
                }
            }
        );


        function updateClock() {
            const now =
                new Date();

            const formatter =
                new Intl.DateTimeFormat(
                    "en-US",
                    {
                        timeZone:
                            "America/New_York",

                        weekday:
                            "short",

                        month:
                            "short",

                        day:
                            "numeric",

                        hour:
                            "numeric",

                        minute:
                            "2-digit",

                        second:
                            "2-digit",

                        hour12:
                            true
                    }
                );

            clockElement.textContent =
                formatter.format(now);
        }


        async function getWeather() {
            try {
                let latitude;
                let longitude;

                if (
                    navigator.geolocation
                ) {
                    const position =
                        await new Promise(
                            (resolve, reject) => {
                                navigator.geolocation.getCurrentPosition(
                                    resolve,
                                    reject,
                                    {
                                        enableHighAccuracy:
                                            false,

                                        timeout:
                                            5000,

                                        maximumAge:
                                            600000
                                    }
                                );
                            }
                        );

                    latitude =
                        position.coords.latitude;

                    longitude =
                        position.coords.longitude;
                } else {
                    throw new Error(
                        "Geolocation unavailable"
                    );
                }

                const weatherURL =
                    "https://api.open-meteo.com/v1/forecast" +
                    "?latitude=" +
                    encodeURIComponent(latitude) +
                    "&longitude=" +
                    encodeURIComponent(longitude) +
                    "&current=temperature_2m,weather_code" +
                    "&temperature_unit=fahrenheit";

                const response =
                    await fetch(
                        weatherURL,
                        {
                            cache: "no-store"
                        }
                    );

                if (!response.ok) {
                    throw new Error(
                        "Weather request failed"
                    );
                }

                const data =
                    await response.json();

                const temperature =
                    Math.round(
                        data.current.temperature_2m
                    );

                const description =
                    weatherDescription(
                        data.current.weather_code
                    );

                weatherElement.textContent =
                    temperature +
                    "°F • " +
                    description;
            } catch (error) {
                weatherElement.textContent =
                    "Weather unavailable";
            }
        }


        function weatherDescription(code) {
            if (code === 0)
                return "Clear";

            if (
                code === 1 ||
                code === 2 ||
                code === 3
            )
                return "Partly Cloudy";

            if (
                code === 45 ||
                code === 48
            )
                return "Fog";

            if (
                code >= 51 &&
                code <= 57
            )
                return "Drizzle";

            if (
                code >= 61 &&
                code <= 67
            )
                return "Rain";

            if (
                code >= 71 &&
                code <= 77
            )
                return "Snow";

            if (
                code >= 80 &&
                code <= 82
            )
                return "Rain Showers";

            if (
                code >= 85 &&
                code <= 86
            )
                return "Snow Showers";

            if (
                code >= 95
            )
                return "Thunderstorm";

            return "Unknown";
        }


        function buildTicker() {
            tickerItems = [];

            const advertisements =
                Array.isArray(
                    config.advertisements
                )
                    ? config.advertisements
                    : [];

            for (
                const advertisement
                of advertisements
            ) {
                tickerItems.push({
                    type: "advertisement",
                    text: advertisement
                });
            }

            tickerItems.push({
                type: "weather",
                text: "Weather"
            });

            tickerIndex = 0;

            showTickerItem();
        }


        function showTickerItem() {
            if (!tickerItems.length) {
                return;
            }

            const item =
                tickerItems[tickerIndex];

            if (
                item.type ===
                "advertisement"
            ) {
                tickerLabelElement.textContent =
                    config.advertisementLabel ||
                    "AD";

                tickerTextElement.textContent =
                    item.text;
            }

            if (
                item.type ===
                "weather"
            ) {
                tickerLabelElement.textContent =
                    config.weatherLabel ||
                    "WEATHER";

                tickerTextElement.textContent =
                    weatherElement.textContent;
            }

            tickerIndex++;

            if (
                tickerIndex >=
                tickerItems.length
            ) {
                tickerIndex = 0;
            }
        }


        function startTicker() {
            if (tickerTimer) {
                clearInterval(tickerTimer);
            }

            const duration =
                Number(
                    config.tickerDuration ||
                    7000
                );

            tickerTimer =
                setInterval(
                    () => {
                        showTickerItem();
                    },
                    duration
                );
        }


        async function initialize() {
            try {
                config =
                    await loadJSON(
                        "config.json"
                    );

                videos =
                    await loadJSON(
                        "videos.json"
                    );

                if (!Array.isArray(videos)) {
                    throw new Error(
                        "videos.json must contain an array"
                    );
                }

                videos =
                    videos.filter(
                        url =>
                            typeof url ===
                            "string" &&
                            url.trim() !== ""
                    );

                applyTheme();

                randomizeVideos();

                playNextVideo();

                updateClock();

                setInterval(
                    updateClock,
                    1000
                );

                await getWeather();

                buildTicker();

                startTicker();

                setInterval(
                    async () => {
                        await getWeather();

                        if (
                            tickerItems[
                                tickerIndex
                            ] &&
                            tickerItems[
                                tickerIndex
                            ].type ===
                            "weather"
                        ) {
                            showTickerItem();
                        }
                    },
                    600000
                );

            } catch (error) {
                console.error(error);

                errorMessage.textContent =
                    "Channel configuration failed.";

                errorMessage.style.display =
                    "block";
            }
        }


        initialize();
    </script>

</body>
</html>
